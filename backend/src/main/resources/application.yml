spring:
  application:
    name: expenseflow
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/expenseflow}
    username: ${DB_USER:${POSTGRES_USER:expenseflow}}
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD:expenseflow}}
    hikari:
      maximum-pool-size: 20
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Kolkata
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  mvc:
    problemdetails:
      enabled: true
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: expenseflow

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

expenseflow:
  jwt:
    secret: ${JWT_SECRET:}
    ttl-minutes: ${JWT_TTL_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  receipts:
    dir: ${RECEIPTS_DIR:./data/receipts}
  sample-audit:
    # Empty = SecureRandom (production). A number makes the 10% sample reproducible.
    seed: ${SAMPLE_AUDIT_SEED:}
  demo-login:
    enabled: false
    max-per-minute: 10
  metrics:
    refresh-ms: 30000

logging:
  pattern:
    level: "%5p [req=%X{requestId:-}]"

---
spring:
  config:
    activate:
      on-profile: demo
expenseflow:
  demo-login:
    enabled: true

---
# One-shot synthetic data job: no web server, exits when done.
spring:
  config:
    activate:
      on-profile: seed
  main:
    web-application-type: none
logging:
  level:
    root: WARN
    com.expenseflow.seed: INFO
